<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscription — Memori'ez</title>
    <link rel="stylesheet" href="../css/index.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="form-box" aria-label="Formulaire d'inscription">
        <div class="form-value">
          <form action="#" method="post">
            <h2>Inscription</h2>
            <div class="inputbox">
              <ion-icon name="mail-outline"></ion-icon>
              <input type="email" id="email" name="email" autocomplete="email" required />
              <label for="email">E-mail</label>
            </div>
            <div class="inputbox">
              <ion-icon name="lock-closed-outline"></ion-icon>
              <input type="password" id="password" name="password" autocomplete="new-password" required />
              <label for="password">Mot de passe</label>
            </div>
            <button type="submit">Créer mon compte</button>
            <a class="play-link" href="../index.html">Retour à l'accueil</a>
            <div class="register">
              <p>Déjà un compte ? <a href="connexion.html">Se connecter</a></p>
            </div>
          </form>
        </div>
      </section>
    </main>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
  </body>
</html>
